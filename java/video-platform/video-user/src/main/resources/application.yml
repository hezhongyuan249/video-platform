# 服务端口
server:
  port: 8082

# 微服务 + 业务 整合配置
spring:
  application:
    name: video-user
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
  # Redis 配置
  redis:
    host: localhost
    port: 6379

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/video_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true